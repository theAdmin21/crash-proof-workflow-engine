server:
  port: 8080

spring:
  application:
    name: flowlab-workflow-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/flowlab_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flowlab-engine-workers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

workflow:
  engine:
    # Heartbeat threshold for workers (seconds)
    worker-heartbeat-timeout-sec: 30
    # Recovery scanner poll interval (milliseconds)
    recovery-poll-interval-ms: 10000
    # Max retry attempts for transient step failures
    max-retry-attempts: 3
    # Initial backoff delay (seconds)
    retry-backoff-sec: 2

logging:
  level:
    com.flowlab: DEBUG
    org.springframework.kafka: INFO
